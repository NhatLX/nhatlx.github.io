<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lời mời vào ví chung iLoveMoney</title>
<meta name="description" content="Bạn được mời vào ví chung gia đình trên iLoveMoney. Mở app và nhập mã để cùng ghi chi tiêu.">
<style>
  :root { --bg: #ffffff; --fg: #14211B; --muted: #5B6761; --line: #CFD8D3; --brand: #0E6B4B; --soft: #DDEFE6; --btn: #14211B; --btn-fg: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0E1512; --fg: #E8EFEB; --muted: #A3B0A9; --line: #34423B; --brand: #3DAA7D; --soft: #173A2C; --btn: #E8EFEB; --btn-fg: #0E1512; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 40px 16px 48px; text-align: center; }
  .logo { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 16px; display: block; }
  h1 { font-size: 1.45em; line-height: 1.3; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 8px; }
  .code-box { margin: 24px 0 10px; border: 2px dashed var(--brand); border-radius: 18px; padding: 16px; }
  .code-box small { color: var(--muted); display: block; }
  .code { font: 700 2em/1.3 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .12em; color: var(--brand); word-break: break-all; }
  button, .store, .open { width: 100%; min-height: 52px; border-radius: 14px; border: 0; font: 600 1em/1 inherit;
                   font-family: inherit; text-decoration: none; display: flex; align-items: center; justify-content: center; margin-top: 10px; cursor: pointer; }
  button { background: var(--soft); color: var(--fg); }
  .open { background: var(--brand); color: #ffffff; }
  .store { background: var(--btn); color: var(--btn-fg); }
  .hint { font-size: .9em; margin-top: 14px; }
  .hidden { display: none; }
  footer { margin-top: 32px; font-size: .8em; color: var(--muted); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <img class="logo" src="img/icon.png" alt="iLoveMoney" onerror="this.style.display='none'">
  <h1>Bạn được mời vào ví chung</h1>
  <p>Cả nhà cùng ghi chi tiêu vào một sổ trên iLoveMoney.</p>

  <div id="with-code" class="hidden">
    <div class="code-box">
      <small>Mã mời</small>
      <div class="code" id="code"></div>
    </div>
    <a class="open" id="open" href="#">Mở iLoveMoney</a>
    <button type="button" id="copy">Sao chép mã</button>
    <p class="hint">Chưa có app? Tải về, đăng nhập rồi vào Thêm › Ví chung gia đình › Vào nhóm bằng mã.</p>
  </div>

  <a class="store" id="ios" href="https://apps.apple.com/vn/app/id6823913582">Tải trên App Store</a>
  <a class="store" id="android" href="https://play.google.com/store/apps/details?id=com.nhatlx.ilovemoney">Tải trên Google Play</a>

  <footer>
    <a href="privacy.html">Quyền riêng tư</a> ·
    <a href="terms.html">Điều khoản</a>
  </footer>
</main>
<script>
(function () {
  // Không cookie, không gửi dữ liệu: chỉ đọc mã trên link.
  var raw = new URLSearchParams(location.search).get('c') || '';
  var code = raw.replace(/[\s-]/g, '').toUpperCase();
  if (!/^[ABCDEFGHJKMNPQRSTUVWXYZ2-9]{8}$/.test(code)) code = null;

  var ua = navigator.userAgent || '';
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
  if (android) document.getElementById('ios').classList.add('hidden');
  else if (ios) document.getElementById('android').classList.add('hidden');

  if (!code) return;
  document.getElementById('with-code').classList.remove('hidden');
  document.getElementById('code').textContent = code;
  // App đã cài thì mở thẳng màn vào nhóm (scheme của bản phát hành).
  document.getElementById('open').href =
    'com.nhatlx.ilovemoney://join?code=' + encodeURIComponent(code);
  var copy = document.getElementById('copy');
  copy.addEventListener('click', function () {
    var done = function () { copy.textContent = 'Đã sao chép ✓'; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, function () {});
    }
  });
})();
</script>
</body>
</html>
